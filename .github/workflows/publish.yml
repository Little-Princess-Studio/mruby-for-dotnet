name: Publish NuGet Package

# Tag-triggered release: push a tag like `v0.1.9` to build all three native
# libs, pack a single cross-platform NuGet, and publish it to nuget.org.
# Requires repo secret NUGET_API_KEY.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native-linux-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "2.9.6"

    - name: Setup GCC
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install build-essential

    - name: Compile mruby for linux
      if: contains(matrix.os, 'ubuntu')
      run: |
          cd ./mruby
          rake MRUBY_CONFIG=../costumized-build-conf-linux.rb all test

    - name: Compile mruby for macos
      if: contains(matrix.os, 'macos')
      run: rake

    - name: Build with XMake
      run: |
        cd mruby-shared
        xmake f -m release
        xmake

    - name: Upload binaries for Linux
      if: contains(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: libmruby-linux-latest
        path: ./mruby-shared/build/linux/x64/release/libmruby_x64.so
        if-no-files-found: error

    - name: Upload binaries for macOS
      if: contains(matrix.os, 'macos')
      uses: actions/upload-artifact@v4
      with:
        name: libmruby-macos-latest
        path: ./mruby-shared/build/macosx/universal/release/libmruby_x64.dylib
        if-no-files-found: error

  publish-windows:
    runs-on: windows-2022
    needs: build-native-linux-macos

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: "2.9.6"

    - name: Compile mruby
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        build-mruby-win.bat
      shell: cmd

    - name: Build with XMake
      run: |
        cd mruby-shared
        xmake f -p windows -a x64 -m release --toolchain=msvc
        xmake

    - name: Download binaries from Linux
      uses: actions/download-artifact@v4
      with:
        name: libmruby-linux-latest
        path: ./mruby-wrapper/MRuby.Library

    - name: Download binaries from macos
      uses: actions/download-artifact@v4
      with:
        name: libmruby-macos-latest
        path: ./mruby-wrapper/MRuby.Library

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies & Build
      run: |
        cd ./mruby-wrapper
        dotnet restore
        dotnet build --configuration=release

    - name: Test .NET project
      run: |
        cd mruby-wrapper
        dotnet test --configuration=release

    - name: Pack
      run: |
        cd mruby-wrapper
        dotnet pack --configuration=release --output ../nupkgs

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push "nupkgs/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Archive built package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkgs/*.nupkg
        if-no-files-found: error
