name: v5 Native-Crash Reproduction (parallel + GCStress)

# The faithful recreation prior experiments lacked. Per MRuby.UnitTest/XunitAssemblyInfo.cs
# the original macOS crash is the reverse-P/Invoke GC-suspension window: GC suspends a
# managed thread (POSIX signal) parked inside a native mruby callback / mrb_close teardown.
# v1-v4 never reproduced it because they lacked: real mruby callback parking, cross-thread
# lifecycle skew, and GC frequency. v5 supplies all three:
#   - parallel build: assembly attribute compiled out (-p:DefineConstants=MRUBY_EXPERIMENT_PARALLEL)
#     + parallel xunit.runner.json  => xUnit runs the V5 worker collections concurrently
#   - DOTNET_GCStress=0x4 => GC at (nearly) every transition: the missing amplifier
#   - MRUBY_V5=1 => activates the tight Open/callback/close churn vehicle
#
# Decisive cells (all locks ON, coverlet ON), per Oracle:
#   A serial   + GCStress=0x4  -> control; expect survives
#   B parallel + GCStress=0x4  -> if THIS hard-crashes & A doesn't => serialization is
#                                 LOAD-BEARING and the reverse-P/Invoke window is the cause
#   C parallel + normal GC     -> ties the amplified repro back to the original CI condition

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Fresh dotnet-test processes per arm'
        required: false
        default: '12'
        type: string
  push:
    branches: [ experiment/v5-parallel-gcstress ]

jobs:
  v5:
    name: ${{ matrix.os }} / ${{ matrix.arm }} / cov-${{ matrix.coverlet }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        arm: [full-serial, full-parallel]
        coverlet: [on, off]

    env:
      REPEATS: ${{ github.event.inputs.repeats || '20' }}
      MRUBY_V5: '1'
      DOTNET_DbgEnableMiniDump: '1'
      DOTNET_DbgMiniDumpType: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.6"

      - name: Compile mruby (macOS)
        run: rake

      - name: Build native shim with XMake
        run: |
          cd mruby-shared
          xmake f -m release
          xmake

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Parallel arms: compile the serialization attribute OUT and install a parallel
      # xunit.runner.json. Serial arm: shipped build untouched.
      - name: Configure build variant
        id: variant
        run: |
          cd mruby-wrapper
          if [ "${{ matrix.arm }}" = "full-serial" ]; then
            echo "defines=" >> "$GITHUB_OUTPUT"
            echo "serial build (shipped attribute kept)"
          else
            echo "defines=MRUBY_EXPERIMENT_PARALLEL" >> "$GITHUB_OUTPUT"
            cat > MRuby.UnitTest/xunit.runner.json <<'JSON'
          {
            "$schema": "https://xunit.net/schema/current/xunit.runner.schema.json",
            "parallelizeAssembly": false,
            "parallelizeTestCollections": true,
            "maxParallelThreads": 0
          }
          JSON
            echo "parallel build (attribute compiled out + parallel json)"
            cat MRuby.UnitTest/xunit.runner.json
          fi

      - name: Build wrapper (Release)
        run: |
          cd mruby-wrapper
          dotnet restore
          dotnet build --configuration=release -p:DefineConstants="${{ steps.variant.outputs.defines }}"

      - name: Run v5 arm ${{ env.REPEATS }}x  [${{ matrix.arm }} / cov-${{ matrix.coverlet }}]
        working-directory: mruby-wrapper
        shell: bash
        env:
          # CONTROL MATRIX (Oracle-recommended): 2x2 {serial,parallel} x {coverlet on,off}.
          # The reproducing run changed TWO things vs the 4 non-reproducing experiments
          # (added coverlet AND --blame-crash), so this isolates coverlet as the amplifier
          # while keeping --blame-crash in BOTH coverlet arms (removes the blame collector
          # as a confound). GC pressure via Server GC + small gen0; no DOTNET_GCStress
          # (0x4 dead on release; 0x1-3 too slow). MRUBY_V5 unset => synthetic vehicle no-ops.
          DOTNET_gcServer: '1'
          DOTNET_gcConcurrent: '1'
          DOTNET_GCgen0size: '0x40000'
        run: |
          repeats="${REPEATS}"
          if [ "${{ matrix.coverlet }}" = "on" ]; then
            collect_arg='--collect:XPlat Code Coverage'
          else
            collect_arg=''
          fi
          echo "arm=${{ matrix.arm }} coverlet=${{ matrix.coverlet }} collect='${collect_arg}' gcServer=1 gen0size=0x40000"
          pass=0; managed_fail=0; host_crash=0; first_crash=0
          for i in $(seq 1 "${repeats}"); do
            echo "::group::repeat ${i}/${repeats}  (${{ matrix.arm }}/cov-${{ matrix.coverlet }})"
            set +e
            # Classify by the ACTUAL crash signature, not the exit code: dotnet test
            # --blame-crash returns exit 1 for BOTH a host crash AND a managed [FAIL], so
            # exit code alone conflates them (the misclassification that hid earlier crashes).
            out=$(dotnet test --configuration=release --no-build ${collect_arg:+"$collect_arg"} \
              --blame-crash --logger "console;verbosity=minimal" 2>&1)
            code=$?
            set -e
            echo "$out" | tail -n 40
            if echo "$out" | grep -q "Test host process crashed\|host process exited unexpectedly"; then
              host_crash=$((host_crash+1)); [ "${first_crash}" -eq 0 ] && first_crash=${i}
              echo "repeat ${i}: HOST CRASH (exit ${code})"
            elif [ "${code}" -eq 0 ]; then
              pass=$((pass+1)); echo "repeat ${i}: pass"
            else
              managed_fail=$((managed_fail+1)); echo "repeat ${i}: managed fail (exit ${code})"
            fi
            echo "::endgroup::"
          done
          echo "==================== V5 CONTROL SUMMARY ===================="
          echo "arm          : ${{ matrix.arm }}"
          echo "coverlet     : ${{ matrix.coverlet }}"
          echo "repeats      : ${repeats}"
          echo "pass         : ${pass}"
          echo "managed_fail : ${managed_fail}  (real xUnit [FAIL])"
          echo "host_crash   : ${host_crash}  (native test-host crash, blame-caught)"
          echo "first_crash  : ${first_crash}"
          echo "STOP: if coverlet-off is 0 host_crash while coverlet-on crashes => coverlet is the amplifier"
          echo "==========================================================="
          exit 0

      - name: Upload crash dumps & blame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-${{ matrix.os }}-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            mruby-wrapper/MRuby.UnitTest/TestResults/**
            ~/*.dmp
            **/*.dmp
            **/core.*
          if-no-files-found: ignore
